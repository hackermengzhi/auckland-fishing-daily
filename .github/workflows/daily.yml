name: Auckland daily fishing report
on:
  schedule:
    - cron: '0 6 * * *'
      timezone: Pacific/Auckland
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-fishing
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - run: pip install -r requirements.txt
      - run: python fetch.py && python render.py
      - uses: actions/upload-artifact@v4
        with:
          name: auckland-fishing-report
          path: reports/
          retention-days: 30
      - name: Save report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/
          git diff --cached --quiet || git commit -m 'Update Auckland daily fishing report'
          git push
      - run: echo 'Generated report saved to reports/latest.png and workflow artifacts.' >> "$GITHUB_STEP_SUMMARY"
